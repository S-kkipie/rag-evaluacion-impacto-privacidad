[project]
name = "pia-rag"
version = "0.1.0"
description = "RAG normativo para un agente de Evaluación de Impacto de Privacidad (EIPD/PIA)"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "langchain-chroma>=1.1.0",
    "langchain-core>=1.6.5",
    "langchain-google-genai>=4.4.0",
    "langchain-text-splitters>=1.1.2",
    "pypdf>=6.19.0",
    "python-dotenv>=1.2.3",
    "streamlit>=1.64.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[project.scripts]
pia-rag = "pia_rag.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pia_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
